<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">오프라인 주방</title><desc id="desc">먼저 온라인으로 열어 필요한 파일을 준비해요</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f0e3ca"/></linearGradient><linearGradient id="plate" x2="0" y2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#efe3ca"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset in="blur" dx="0" dy="5" result="offsetBlur"/><feComponentTransfer in="offsetBlur" result="shadow"><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="960" height="540" rx="30" fill="url(#paper)"/><path d="M0 437 Q100 405 190 440 T390 445 T620 440 T960 430 V540 H0Z" fill="#e6d3ae" opacity=".46"/><circle cx="893" cy="57" r="28" fill="#ead5a5" opacity=".58"/><circle cx="94" cy="472" r="35" fill="#d2dfc4" opacity=".5"/><path d="M86 65 q12 -25 24 0 q-13 19 -24 0 M848 458 q12 -25 24 0 q-13 19 -24 0" fill="#b9cdaa" opacity=".65"/><text x="60" y="71" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="40" font-weight="800" fill="#28685d">오프라인 주방</text><text x="62" y="108" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="500" fill="#70604b">먼저 온라인으로 열어 필요한 파일을 준비해요</text><line x1="62" y1="123" x2="898" y2="123" stroke="#ddc9a9" stroke-width="2" stroke-linecap="round" /><rect x="114" y="174" width="344" height="194" rx="22" fill="#fffdf7" stroke="#e3d2b4" stroke-width="2"/><circle cx="163" cy="224" r="27" fill="#28685d" opacity=".14"/><text x="163" y="233" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="800" fill="#28685d">1</text><text x="205" y="218" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="24" font-weight="800" fill="#3d3026">온라인 접속</text><text x="205" y="252" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18" font-weight="500" fill="#70604b">앱과 필요한 자료 준비</text><rect x="502" y="174" width="344" height="194" rx="22" fill="#fffdf7" stroke="#e3d2b4" stroke-width="2"/><circle cx="551" cy="224" r="27" fill="#955c0f" opacity=".14"/><text x="551" y="233" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="800" fill="#955c0f">2</text><text x="593" y="218" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="24" font-weight="800" fill="#3d3026">오프라인 학습</text><text x="593" y="252" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18" font-weight="500" fill="#70604b">저장된 범위에서 계속</text><text x="286" y="315" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="24" font-weight="800" fill="#28685d">연결하여 준비</text><text x="674" y="315" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="24" font-weight="800" fill="#3d3026">열어 본 자료 활용</text><rect x="90" y="442" width="780" height="48" rx="16" fill="#edf4e8" stroke="#ccdfc4" stroke-width="2"/><text x="480" y="474" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#28685d">아직 열지 않은 삽화는 연결이 필요할 수 있어요</text></svg>