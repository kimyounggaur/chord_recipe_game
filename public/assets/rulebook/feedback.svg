<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">틀려도 괜찮아요</title><desc id="desc">선택한 음을 유지하면서 어떤 간격을 고칠지 알려줘요</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f0e3ca"/></linearGradient><linearGradient id="plate" x2="0" y2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#efe3ca"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset in="blur" dx="0" dy="5" result="offsetBlur"/><feComponentTransfer in="offsetBlur" result="shadow"><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="960" height="540" rx="30" fill="url(#paper)"/><path d="M0 437 Q100 405 190 440 T390 445 T620 440 T960 430 V540 H0Z" fill="#e6d3ae" opacity=".46"/><circle cx="893" cy="57" r="28" fill="#ead5a5" opacity=".58"/><circle cx="94" cy="472" r="35" fill="#d2dfc4" opacity=".5"/><path d="M86 65 q12 -25 24 0 q-13 19 -24 0 M848 458 q12 -25 24 0 q-13 19 -24 0" fill="#b9cdaa" opacity=".65"/><text x="60" y="71" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="40" font-weight="800" fill="#28685d">틀려도 괜찮아요</text><text x="62" y="108" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="500" fill="#70604b">선택한 음을 유지하면서 어떤 간격을 고칠지 알려줘요</text><line x1="62" y1="123" x2="898" y2="123" stroke="#ddc9a9" stroke-width="2" stroke-linecap="round" /><rect x="111" y="154" width="738" height="248" rx="24" fill="#fffdf7" stroke="#dfcfb2" stroke-width="2"/><rect x="154" y="184" width="650" height="83" rx="18" fill="#fff1e6" stroke="#e4b89b" stroke-width="2"/><text x="182" y="220" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="27" font-weight="800" fill="#a4473d">가운데 음을 다시 살펴봐요</text><text x="182" y="250" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="21" font-weight="600" fill="#3d3026">지금 3반음  ·  목표 4반음</text><text x="480" y="335" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#28685d">틀린 접시 선택 → 음 바꾸기 → 다시 확인</text><rect x="90" y="442" width="780" height="48" rx="16" fill="#edf4e8" stroke="#ccdfc4" stroke-width="2"/><text x="480" y="474" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#28685d">기존에 맞힌 음은 그대로 두고 고칠 수 있어요</text></svg>