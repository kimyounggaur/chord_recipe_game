<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">주방장의 힌트</title><desc id="desc">차근차근 필요한 만큼만 열어 보세요</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f0e3ca"/></linearGradient><linearGradient id="plate" x2="0" y2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#efe3ca"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset in="blur" dx="0" dy="5" result="offsetBlur"/><feComponentTransfer in="offsetBlur" result="shadow"><feFuncA type="linear" slope="0.13"/></feComponentTransfer><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="960" height="540" rx="30" fill="url(#paper)"/><path d="M0 437 Q100 405 190 440 T390 445 T620 440 T960 430 V540 H0Z" fill="#e6d3ae" opacity=".46"/><circle cx="893" cy="57" r="28" fill="#ead5a5" opacity=".58"/><circle cx="94" cy="472" r="35" fill="#d2dfc4" opacity=".5"/><path d="M86 65 q12 -25 24 0 q-13 19 -24 0 M848 458 q12 -25 24 0 q-13 19 -24 0" fill="#b9cdaa" opacity=".65"/><text x="60" y="71" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="40" font-weight="800" fill="#28685d">주방장의 힌트</text><text x="62" y="108" text-anchor="start" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="500" fill="#70604b">차근차근 필요한 만큼만 열어 보세요</text><line x1="62" y1="123" x2="898" y2="123" stroke="#ddc9a9" stroke-width="2" stroke-linecap="round" /><rect x="104" y="172" width="216" height="204" rx="22" fill="#fffdf7" stroke="#dfcfb2" stroke-width="2"/><circle cx="212" cy="220" r="30" fill="#a4473d"/><text x="212" y="229" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="26" font-